<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f4f8;
    }
    h1 {
      color: #1e293b;
    }
    #status {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: #475569;
      min-height: 1.5em;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 8px;
    }
    .cell {
      width: 100px;
      height: 100px;
      font-size: 2.5rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      color: #1e293b;
      transition: background 0.15s;
    }
    .cell:hover:not(:disabled) {
      background: #e2e8f0;
    }
    .cell.x {
      color: #2563eb;
    }
    .cell.o {
      color: #dc2626;
    }
    .cell:disabled {
      cursor: default;
    }
    #reset {
      margin-top: 20px;
      padding: 10px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #1e293b;
      color: #ffffff;
      cursor: pointer;
    }
    #reset:hover {
      background: #334155;
    }
    #game.hidden {
      display: none;
    }
    #title-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      z-index: 10;
    }
    #title-screen h1 {
      font-size: 4rem;
      color: #ffffff;
      margin: 0 0 8px;
    }
    #title-screen p {
      color: #94a3b8;
      margin: 0 0 40px;
      font-size: 1.2rem;
    }
    #start {
      padding: 14px 40px;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.15s;
    }
    #start:hover {
      background: #1d4ed8;
    }
    #leaderboard-btn {
      margin-top: 16px;
      padding: 10px 24px;
      font-size: 1rem;
      border: 2px solid #475569;
      border-radius: 8px;
      background: transparent;
      color: #cbd5e1;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    #leaderboard-btn:hover {
      background: #475569;
      color: #ffffff;
    }
    #leaderboard {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.8);
      z-index: 30;
    }
    #leaderboard.show {
      display: flex;
    }
    .leaderboard-box {
      background: #ffffff;
      padding: 32px 48px;
      border-radius: 16px;
      text-align: center;
      min-width: 260px;
    }
    .leaderboard-box h2 {
      margin: 0 0 20px;
      color: #1e293b;
    }
    .leaderboard-box table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
    }
    .leaderboard-box th, .leaderboard-box td {
      padding: 8px 12px;
      font-size: 1.1rem;
    }
    .leaderboard-box th {
      color: #64748b;
      font-weight: 600;
      border-bottom: 2px solid #e2e8f0;
    }
    .leaderboard-box td {
      color: #1e293b;
    }
    #leaderboard-close {
      padding: 10px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #1e293b;
      color: #ffffff;
      cursor: pointer;
    }
    #leaderboard-close:hover {
      background: #334155;
    }
    #game-over {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.7);
      z-index: 20;
    }
    #game-over.show {
      display: flex;
    }
    .game-over-box {
      background: #ffffff;
      padding: 40px 60px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      transform: scale(0.5);
      opacity: 0;
      animation: pop-in 0.4s ease-out forwards;
    }
    .game-over-box h2 {
      margin: 0 0 8px;
      font-size: 2.2rem;
    }
    .game-over-box h2.x {
      color: #2563eb;
    }
    .game-over-box h2.o {
      color: #dc2626;
    }
    .game-over-box p {
      margin: 0;
      color: #64748b;
      font-size: 1.1rem;
    }
    @keyframes pop-in {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="title-screen">
    <h1>Tic-Tac-Toe</h1>
    <p>Two players, one winner.</p>
    <button id="start">Start Game</button>
    <button id="leaderboard-btn">Leaderboard</button>
  </div>

  <div id="game" class="hidden">
    <h1>Tic-Tac-Toe</h1>
    <div id="status">Player X's turn</div>
    <div id="board"></div>
    <button id="reset">Reset</button>
  </div>

  <div id="game-over">
    <div class="game-over-box">
      <h2 id="game-over-title"></h2>
      <p>Returning to title screen...</p>
    </div>
  </div>

  <div id="leaderboard">
    <div class="leaderboard-box">
      <h2>Leaderboard</h2>
      <table>
        <tr>
          <th>Player X</th>
          <th>Player O</th>
          <th>Draws</th>
        </tr>
        <tr>
          <td id="lb-x">0</td>
          <td id="lb-o">0</td>
          <td id="lb-draws">0</td>
        </tr>
      </table>
      <button id="leaderboard-close">Close</button>
    </div>
  </div>

  <script>
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('reset');
    const startBtn = document.getElementById('start');
    const titleScreen = document.getElementById('title-screen');
    const gameEl = document.getElementById('game');
    const gameOverEl = document.getElementById('game-over');
    const gameOverTitle = document.getElementById('game-over-title');
    const leaderboardBtn = document.getElementById('leaderboard-btn');
    const leaderboardEl = document.getElementById('leaderboard');
    const leaderboardClose = document.getElementById('leaderboard-close');
    const lbX = document.getElementById('lb-x');
    const lbO = document.getElementById('lb-o');
    const lbDraws = document.getElementById('lb-draws');

    const STORAGE_KEY = 'tic-tac-toe-stats';
    let stats = loadStats();

    function loadStats() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const data = raw ? JSON.parse(raw) : {};
        return {
          x: data.x || 0,
          o: data.o || 0,
          draws: data.draws || 0
        };
      } catch (e) {
        return { x: 0, o: 0, draws: 0 };
      }
    }

    function saveStats() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
    }

    function recordResult(winner) {
      if (winner === 'X') stats.x++;
      else if (winner === 'O') stats.o++;
      else stats.draws++;
      saveStats();
    }

    let board = Array(9).fill(null);
    let currentPlayer = 'X';
    let gameOver = false;

    const winLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    function render() {
      boardEl.innerHTML = '';
      board.forEach((value, i) => {
        const cell = document.createElement('button');
        cell.className = 'cell' + (value ? ' ' + value.toLowerCase() : '');
        cell.textContent = value || '';
        cell.disabled = !!value || gameOver;
        cell.addEventListener('click', () => handleMove(i));
        boardEl.appendChild(cell);
      });
    }

    function checkWinner() {
      for (const line of winLines) {
        const [a, b, c] = line;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return board[a];
        }
      }
      return null;
    }

    function showGameOver(title, colorClass) {
      gameOverTitle.textContent = title;
      gameOverTitle.className = colorClass;
      gameOverEl.classList.add('show');
      setTimeout(returnToTitle, 2500);
    }

    function showLeaderboard() {
      lbX.textContent = stats.x;
      lbO.textContent = stats.o;
      lbDraws.textContent = stats.draws;
      leaderboardEl.classList.add('show');
    }

    function hideLeaderboard() {
      leaderboardEl.classList.remove('show');
    }

    function returnToTitle() {
      gameOverEl.classList.remove('show');
      gameEl.classList.add('hidden');
      titleScreen.style.display = 'flex';
    }

    function handleMove(i) {
      if (board[i] || gameOver) return;
      board[i] = currentPlayer;
      const winner = checkWinner();
      if (winner) {
        gameOver = true;
        statusEl.textContent = 'Player ' + winner + ' wins!';
        recordResult(winner);
        showGameOver('Player ' + winner + ' wins!', winner.toLowerCase());
      } else if (board.every(cell => cell)) {
        gameOver = true;
        statusEl.textContent = "It's a draw!";
        recordResult(null);
        showGameOver("It's a draw!", '');
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        statusEl.textContent = 'Player ' + currentPlayer + "'s turn";
      }
      render();
    }

    function reset() {
      board = Array(9).fill(null);
      currentPlayer = 'X';
      gameOver = false;
      statusEl.textContent = "Player X's turn";
      render();
    }

    function startGame() {
      titleScreen.style.display = 'none';
      gameEl.classList.remove('hidden');
      reset();
    }

    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', reset);
    leaderboardBtn.addEventListener('click', showLeaderboard);
    leaderboardClose.addEventListener('click', hideLeaderboard);
  </script>
</body>
</html>
